[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alekhyam"
version = "0.0.1"
description = "Alekhyam: A Simple Python Plotter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scienceplots>=2.1",
    "qtawesome>=1.3",
    "pywin32; sys_platform == 'win32'",
    "winshell; sys_platform == 'win32'",
]

[project.scripts]
alekhyam = "alekhyam.app:main"
alekhyam-register = "alekhyam.desktopEntry:main"

[tool.setuptools]
packages = ["alekhyam"]
include-package-data = true

[tool.setuptools.package-data]
alekhyam = ["resources/*"]

[tool.setuptools.data-files]
"share/applications" = ["alekhyam/resources/alekhyam.desktop"]
"share/icons/hicolor/scalable/apps" = ["alekhyam/resources/alekhyam.svg"]
"share/icons/hicolor/256x256/apps" = ["alekhyam/resources/alekhyam.png"]
